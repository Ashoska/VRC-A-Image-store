name: Rebuild manifest

# Keeps manifest.json (what the VRC-A app reads) in step with the pictures under images/.
on:
  push:
    branches: [main]
    paths: ["images/**", "tools/build_manifest.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_manifest.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- manifest.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Rebuild manifest"
          # The avatar catalog bots push here too: rebase onto anything that landed meanwhile.
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
